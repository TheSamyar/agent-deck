name: Bug report
description: Report something that is broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, prompts, or private project paths.
  - type: input
    id: environment
    attributes:
      label: Mac model, macOS version, and Agent Deck version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
